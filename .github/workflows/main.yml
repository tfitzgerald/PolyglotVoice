name: Build Polyglot Voice APK

on:
  push:
    branches: [ "main" ] # Runs every time you push to the main branch

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Build Release APK
      run: ./gradlew assembleRelease

    - name: Find and Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: PolyglotVoice-Release-APK
        path: app/build/outputs/apk/release/*.apk # Using wildcard for reliability

    - name: Create Release
      if: github.event_name == 'push' && github.ref == 'refs/heads/main'
      uses: softprops/action-gh-release@v1
      with:
        files: app/build/outputs/apk/release/*.apk # Using wildcard here too
        tag_name: v${{ github.run_number }}
        name: Release v${{ github.run_number }}
        body: |
          New build generated automatically.
          Check the assets below for the APK file.
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}